apiVersion: v1
kind: ConfigMap
metadata:
  name: policypulse-config
  namespace: policypulse
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  APP_URL: "https://policypulse.example.com"
  APP_VERSION: "0.2.0"
  LOG_LEVEL: "info"
  TRUST_PROXY_HEADERS: "true"
  DATABASE_POOL_MAX: "5"
  EMAIL_PROVIDER: "smtp"
  GEMINI_AUTH_MODE: "api-key"
  WATCH_MAX_DOCS_PER_RUN: "4"
