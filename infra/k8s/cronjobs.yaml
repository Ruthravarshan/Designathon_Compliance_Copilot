apiVersion: batch/v1
kind: CronJob
metadata:
  name: policypulse-email-drain
  namespace: policypulse
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron-worker
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drain
              image: curlimages/curl:8.11.1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: policypulse-secrets
                      key: CRON_SECRET
              args:
                - -fsS
                - -H
                - "Authorization: Bearer $(CRON_SECRET)"
                - "http://policypulse-web.policypulse.svc.cluster.local/api/cron/email"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
---
