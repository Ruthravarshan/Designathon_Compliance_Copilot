# Reference template only — NEVER commit real secret values.
# In production, sync secrets via External Secrets Operator (ESO) or SealedSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: policypulse-secrets
  namespace: policypulse
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@postgres.internal:5432/policypulse?sslmode=require"
  DIRECT_URL: "postgresql://user:pass@postgres.internal:5432/policypulse?sslmode=require"
  REDIS_URL: "rediss://redis.internal:6379"
  AUTH_SECRET: "<replace-with-32-byte-base64>"
  CRON_SECRET: "<replace-with-24-byte-hex>"
  TOKEN_ENCRYPTION_KEY: "<replace-with-32-byte-base64>"
  GEMINI_API_KEY: "<replace-with-server-only-key>"
