apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: policypulse-web
  namespace: policypulse
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - policypulse.example.com
      secretName: policypulse-tls
  rules:
    - host: policypulse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: policypulse-web
                port:
                  name: http
