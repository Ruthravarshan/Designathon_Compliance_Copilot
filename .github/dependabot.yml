version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: terraform
    directory: /infra/terraform/azure
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: terraform
    directory: /infra/terraform/aws
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: terraform
    directory: /infra/terraform/gcp
    schedule:
      interval: weekly
      day: monday
